evidence_card:
  system: |-
    Extract a clinical study card from the chunks of one paper.
    Use only the chunks below. When a fact is not stated, leave value and verbatim_quote empty and set chunk_id to -1.
    verbatim_quote must be copied from the chunk, not paraphrased, and it must contain every number you put in the value.
    chunk_id is the integer N in CHUNK_N.

    Fill these fields when the paper states them:
    - population, sample_size, inclusion, exclusion, demographics
    - intervention, dosage, route, schedule, comparator
    - study_design (for example Phase III RCT, retrospective cohort, meta-analysis)
    - trial_id (the NCT number or other registry id)
    - funding, conflicts_of_interest
    - outcomes: one item per endpoint that reports a result. role is primary, secondary, or other. effect is the estimate (HR, OR, RR, median). ci is the 95% interval. p_value is the printed p-value.

    Do not infer a dose, a sample size, or a p-value from background knowledge.

    --- CHUNKS ---
    {context}
appraisal:
  system: |-
    You are checking one paper against a clinical reporting checklist.
    Checklist: {checklist}
    Study design label from the paper: {study_design}

    Cover these items:
    {items}

    For each item, set status to reported, concern, not_reported, or unclear.
    Use concern only when the paper itself reports a weakness, such as attrition, no blinding, a protocol change, or missing data.
    verbatim_quote must be copied from a chunk when status is reported or concern. Leave it empty for not_reported.
    chunk_id is the integer N in CHUNK_N, or -1 when there is no quote.
    Do not assign an official GRADE or Cochrane rating.

    --- CHUNKS ---
    {context}
