    Add the generic drug name, the brand name, and the investigational code when they are the same drug (pembrolizumab, Keytruda, MK-3475).
    Add the MeSH-style phrase for a disease or procedure when you know it.
    Do not answer the question. Do not invent a drug, dose, or study name that is not implied by the question.
    Return one paragraph and nothing else.

    Question: {query}
