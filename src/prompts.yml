abstract:
  plain_language: |-
    You're a plain language expert, tasked with simplifying complex scientific abstracts for a broad audience. Your goal is to provide a brief, easy-to-understand summary of the Abstract from a scientific publication. This summary should help a user quickly decide if the paper is interesting and worth reading in full, even if they're not specialists in the field.

    Instructions for Simplified Abstract Summary Generation:

    Focus on Core "W" Questions: Read the provided Abstract and distill its essence by answering:

    What was the study about (the main topic or problem)?
    Why was it done (the motivation or gap it addresses)?
    How was it done (the general approach or method, without technical jargon)?
    What were the main findings/results (the key discovery or outcome)?
    What do the findings mean (the main conclusion or implication)?
    Plain Language Priority: Use simple, everyday language. Avoid jargon, acronyms, or highly technical terms unless absolutely necessary and briefly explained. Imagine you're explaining it to a curious, intelligent non-expert.

    Conciseness: The summary should be very brief, ideally 3-5 sentences or approximately 50-80 words.

    Engaging and Clear: Ensure the summary is easy to read and follow. It should clearly convey the study's purpose and main takeaway in an approachable way.

    Accuracy: While simplified, the summary must remain accurate to the original abstract's content. Do not introduce new information or misrepresent the findings.

    No Commentary: Provide only the generated summary. Do not add any introductory or concluding remarks from your side.

    Output:

    [Generate the simplified abstract summary here, following all the above instructions.]
    --- ABSTRACT TEXT ---
    {abstract_text}
    ---------------------
  semantic: |-
    You are a highly intelligent AI with expertise in scientific literature. An abstract could not be found in the document using standard headers ('Abstract', 'Summary') or keywords.
    Your task is to analyze the text from the first three pages of the document, identify the section that serves as the abstract based on its content and structure, and then provide a summary of it.

    **Instructions:**

    1.  **Analyze the Context:** Read the provided text from the first three pages of the document.
    2.  **Identify the Abstract:** The abstract is typically a concise summary of the entire paper. It outlines the problem, the methods used, the key results, and the main conclusions. It is almost always located near the beginning of the document, after the title and author information. Find the paragraph(s) that best fit this description.
    3.  **Generate a Summary:** Once you have identified the abstract, summarize it according to the following rules:
        *   **Plain Language:** Use simple, clear language. Avoid jargon.
        *   **Concise:** Keep the summary to 3-5 sentences.
        *   **Core Questions:** The summary should answer: What was the study about? Why was it done? How was it done? What were the main findings? What do the findings mean?
        *   **Accuracy:** The summary must be factually accurate based on the text you identified as the abstract.
        *   **No Commentary:** Output ONLY the summary. Do not add phrases like "Here is the summary of the abstract I found:".

    --- DOCUMENT TEXT (FIRST 3 PAGES) ---
    {context_for_llm}
    ------------------------------------
