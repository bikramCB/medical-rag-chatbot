name: Check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the Python files parse
        run: python -m compileall -q src
      - name: Test the scorecard interval checks
        run: |
          pip install pytest
          python -m pytest tests
