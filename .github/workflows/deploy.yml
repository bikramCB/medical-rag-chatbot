name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, rag-app]
    timeout-minutes: 90
    steps:
      - name: Rebuild and restart the app container
        run: |
          set -eu
          cd /home/bikimj03/medical-rag-chatbot
          git fetch origin main
          git clean -fd
          git checkout -B main origin/main
          docker build -f ci-cd/Dockerfile -t rag-app:latest .
          docker rm -f rag-app
          docker run -d --name rag-app --restart unless-stopped \
            -p 8501:8501 \
            --env-file /home/bikimj03/medical-rag-chatbot/src/.env \
            -v rag-uploads:/app/src/uploads \
            -v rag-scorecards:/app/scorecards \
            -v rag-bundles:/app/bundles \
            -v rag-state:/app/state_store \
            rag-app:latest
          docker exec rag-app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=20).read()"
